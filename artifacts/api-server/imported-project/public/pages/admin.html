<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXVORA Control Center</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="shell"><nav><a class="brand" href="/">NEXVORA</a><button id="logout" class="quiet">Sign out</button></nav><section id="login" class="panel"><p class="eyebrow">SECURE CONTROL CENTER</p><h1>Operator access</h1><form id="login-form"><input id="email" type="email" placeholder="Work email" required><input id="password" type="password" placeholder="Password" required minlength="12"><button>Authenticate</button></form><p id="login-error" class="error"></p></section><section id="console" hidden><div class="topline"><div><p class="eyebrow">NETWORK OPERATIONS</p><h1>Asset movement console</h1></div><button id="refresh" class="quiet">Refresh</button></div><section class="grid"><article class="panel"><h2>Create asset movement</h2><form id="create-form"><input name="consignee_name" placeholder="Consignee name" required><input name="weight_kg" type="number" min=".01" step=".01" placeholder="Weight (kg)" required><input name="city" placeholder="Destination city"><input name="country" maxlength="2" placeholder="Country code"><select name="service_type"><option>standard</option><option>express</option><option>economy</option></select><button>Create visibility code</button></form></article><article class="panel map"><h2>Network map</h2><div id="map">Aggregated active movements<br><small>Exact locations remain protected.</small></div></article></section><section class="panel"><h2>Active asset movements</h2><div id="shipments" class="table"></div></section><section class="panel" id="action-panel" hidden><h2 id="selected-title">Manual override</h2><form id="status-form" class="inline"><select id="new-status"><option>picked_up</option><option>in_transit</option><option>out_for_delivery</option><option>delivered</option><option>failed</option><option>cancelled</option></select><button>Apply status</button><button type="button" id="simulate" class="quiet">Run demo sequence</button></form><form id="location-form" class="inline"><input id="lat" type="number" step="any" placeholder="Latitude"><input id="lng" type="number" step="any" placeholder="Longitude"><button>Set verified location</button></form><pre id="action-output"></pre></section></section></main><script src="/js/admin.js"></script></body></html>
