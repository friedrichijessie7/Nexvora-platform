<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4D148C"><title>Track a shipment | FedEx</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="site-header"><div class="shell main-nav"><a class="brand" href="/" aria-label="FedEx home">FedEx<span class="brand-arrow" aria-hidden="true">➜</span></a><nav><a href="/">Home</a><a href="/signup.html">Create account</a><a href="/login.html">Sign in</a></nav></div></header><main class="section"><div class="shell"><p class="eyebrow">SHIPMENT TRACKING</p><h1>Track your shipment</h1><form id="track-form" class="tracking-form" novalidate><label for="tracking-code">Tracking code</label><div class="tracking-row"><input id="tracking-code" name="code" autocomplete="off" placeholder="NX-XXXXXXXXXX-00" required><button class="button-primary" type="submit">Track</button></div><p class="form-status" id="track-status" role="status" aria-live="polite"></p></form><section id="result" class="panel" hidden aria-live="polite"><div class="result-heading"><div><p class="eyebrow">CURRENT STATUS</p><h2 id="result-status"></h2></div><code id="result-code"></code></div><div class="tracking-grid"><div><span class="muted">Service</span><strong id="result-service"></strong></div><div><span class="muted">Current location</span><strong id="result-location"></strong></div><div><span class="muted">Last verified</span><strong id="result-time"></strong></div></div><div class="progress-track"><span id="progress-bar"></span></div><p id="progress-label" class="muted"></p><h3>Tracking timeline</h3><ol id="timeline" class="timeline"></ol></section></div></main><script src="/js/track.js"></script></body></html>
